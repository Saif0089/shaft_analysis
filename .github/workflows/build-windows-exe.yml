name: Build Windows Executable

on:
  push:
    branches: [main, temp_branch]
    paths:
      - 'gui_tool/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Portable Python Package
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create portable distribution
      run: |
        # Create distribution folder
        New-Item -ItemType Directory -Force -Path dist/ShaftSegmentation

        # Download Python embeddable package
        $pythonUrl = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
        Write-Host "Downloading Python embeddable..."
        Invoke-WebRequest -Uri $pythonUrl -OutFile python-embed.zip
        Expand-Archive -Path python-embed.zip -DestinationPath dist/ShaftSegmentation/python -Force

        # Enable pip in embeddable Python by uncommenting import site
        $pthFile = Get-ChildItem "dist/ShaftSegmentation/python/python*._pth" | Select-Object -First 1
        (Get-Content $pthFile.FullName) -replace '#import site', 'import site' | Set-Content $pthFile.FullName
        Add-Content $pthFile.FullName "Lib\site-packages"

        # Download and install pip
        Write-Host "Installing pip..."
        Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
        & dist/ShaftSegmentation/python/python.exe get-pip.py --no-warn-script-location

        # Install all dependencies
        Write-Host "Installing dependencies..."
        & dist/ShaftSegmentation/python/python.exe -m pip install --no-warn-script-location `
          PyQt5>=5.15.0 `
          numpy>=1.21.0 `
          laspy>=2.0.0 `
          plyfile>=0.7.0 `
          matplotlib>=3.5.0 `
          scikit-learn `
          torch torchvision --index-url https://download.pytorch.org/whl/cpu

        # Copy application files
        Write-Host "Copying application files..."
        Copy-Item gui_tool/shaft_segmentation_gui.py -Destination dist/ShaftSegmentation/
        Copy-Item -Recurse gui_tool/checkpoints -Destination dist/ShaftSegmentation/ -ErrorAction SilentlyContinue
        Copy-Item -Recurse gui_tool/models -Destination dist/ShaftSegmentation/ -ErrorAction SilentlyContinue

        # Create launcher batch file
        Write-Host "Creating launcher..."
        $batContent = '@echo off' + "`r`n" + 'cd /d "%~dp0"' + "`r`n" + 'start "" "python\pythonw.exe" "shaft_segmentation_gui.py"'
        Set-Content -Path "dist/ShaftSegmentation/ShaftSegmentation.bat" -Value $batContent -NoNewline

        # Create alternative launcher
        Write-Host "Creating run.bat..."
        $runContent = '@echo off' + "`r`n" + 'cd /d "%~dp0"' + "`r`n" + 'python\pythonw.exe shaft_segmentation_gui.py'
        Set-Content -Path "dist/ShaftSegmentation/run.bat" -Value $runContent -NoNewline

    - name: Test app launches
      working-directory: dist/ShaftSegmentation
      continue-on-error: true
      run: |
        Write-Host "Testing if app can start..."
        $proc = Start-Process -FilePath "python\pythonw.exe" -ArgumentList "shaft_segmentation_gui.py" -PassThru
        Start-Sleep -Seconds 15
        if ($proc.HasExited) {
          Write-Host "Process exited with code: $($proc.ExitCode)"
          # Try with python.exe to see error
          Write-Host "Trying with python.exe to see errors..."
          & python\python.exe shaft_segmentation_gui.py 2>&1 | Select-Object -First 50
        } else {
          Write-Host "App is running successfully after 15 seconds!"
          $proc.Kill()
        }

    - name: Take screenshot of running app
      working-directory: dist/ShaftSegmentation
      continue-on-error: true
      run: |
        # Use system Python for screenshot
        pip install pyautogui pillow
        $proc = Start-Process -FilePath "python\pythonw.exe" -ArgumentList "shaft_segmentation_gui.py" -PassThru
        Start-Sleep -Seconds 12
        python -c "import pyautogui; s=pyautogui.screenshot(); s.save('../../screenshot.png'); print('Screenshot saved!')"
        if (-not $proc.HasExited) { $proc.Kill() }

    - name: Upload screenshot
      uses: actions/upload-artifact@v4
      with:
        name: app-screenshot
        path: screenshot.png
        if-no-files-found: warn

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path dist/ShaftSegmentation -DestinationPath ShaftSegmentation_Portable.zip

    - name: Get version info
      id: version
      run: |
        $date = Get-Date -Format "yyyy.MM.dd"
        $sha = "${{ github.sha }}".Substring(0, 7)
        echo "version=v$date-$sha" >> $env:GITHUB_OUTPUT
        echo "date=$date" >> $env:GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Shaft Segmentation Tool ${{ steps.version.outputs.date }}
        body: |
          ## Shaft Point Cloud Segmentation Tool (Portable)

          **Model:** Epoch 341 (93.4% accuracy, 84.3% mIoU)

          ### Downloads
          - **ShaftSegmentation_Portable.zip** - Portable Python package, works on any 64-bit Windows PC

          ### Installation
          1. Download and extract the ZIP file
          2. Double-click `ShaftSegmentation.bat` to run
          3. No installation or admin rights required

          ### Features
          - Accepts LAS, E57, PLY, PCD point cloud files
          - Automatic 10m vertical slicing
          - 8-class segmentation: wall, pipe, guard, bunton, wire, column, sheet, column2
          - Outputs combined PLY + per-class family PLYs + visualizations

          ### Usage
          1. Run `ShaftSegmentation.bat`
          2. Select your point cloud file and output directory
          3. Click "Start Processing"

          Built from commit: ${{ github.sha }}
        files: |
          ShaftSegmentation_Portable.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Output download links
      run: |
        Write-Host "============================================"
        Write-Host "PUBLIC DOWNLOAD LINK"
        Write-Host "============================================"
        Write-Host ""
        Write-Host "https://github.com/${{ github.repository }}/releases/latest/download/ShaftSegmentation_Portable.zip"
        Write-Host ""
        Write-Host "============================================"
