name: Build Windows Executable

on:
  push:
    branches: [main, temp_branch]
    paths:
      - 'gui_tool/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build CPU & GPU and Create Release
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install PyQt5>=5.15.0
        pip install numpy>=1.21.0
        pip install laspy>=2.0.0
        pip install plyfile>=0.7.0
        pip install matplotlib>=3.5.0

    # Build CPU Version
    - name: Install PyTorch CPU
      run: |
        pip uninstall -y torch torchvision 2>$null
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

    - name: Build CPU executable
      working-directory: gui_tool
      run: |
        # Use --onedir for better PyTorch compatibility
        # DLL path setup is now in shaft_segmentation_gui.py itself (before torch import)
        pyinstaller --clean --onedir --noconsole --name ShaftSegmentation `
          --add-data "checkpoints;checkpoints" `
          --add-data "models;models" `
          --collect-all torch `
          --collect-binaries torch `
          --copy-metadata torch `
          --hidden-import torch `
          --hidden-import torch.nn `
          --hidden-import torch.nn.functional `
          --hidden-import torch.utils `
          --hidden-import torch.utils.data `
          --hidden-import torch._C `
          --hidden-import torch.lib `
          --collect-all intel-openmp `
          --collect-binaries intel-openmp `
          --hidden-import PyQt5 `
          --hidden-import PyQt5.QtWidgets `
          --hidden-import PyQt5.QtCore `
          --hidden-import PyQt5.QtGui `
          --hidden-import numpy `
          --hidden-import laspy `
          --hidden-import plyfile `
          --hidden-import matplotlib `
          --hidden-import matplotlib.pyplot `
          --hidden-import sklearn `
          --hidden-import sklearn.decomposition `
          shaft_segmentation_gui.py

    - name: Copy torch DLLs to _internal root
      working-directory: gui_tool/dist/ShaftSegmentation/_internal
      run: |
        # PyTorch looks for DLLs in the root of _internal, not in torch/lib
        # Copy all torch DLLs to the root _internal folder
        Write-Host "Copying torch DLLs to _internal root..."
        if (Test-Path "torch/lib") {
          Copy-Item "torch/lib/*.dll" -Destination "." -Force
          Write-Host "Copied DLLs from torch/lib:"
          Get-ChildItem "torch/lib/*.dll" | ForEach-Object { Write-Host "  - $($_.Name)" }
        }
        # Also copy any other torch-related DLLs
        Get-ChildItem -Recurse -Filter "*.dll" -Path "torch" | ForEach-Object {
          if (-not (Test-Path $_.Name)) {
            Copy-Item $_.FullName -Destination "." -Force
            Write-Host "Copied: $($_.Name)"
          }
        }

    - name: List DLLs in dist folder
      working-directory: gui_tool/dist/ShaftSegmentation
      run: |
        Write-Host "=== All DLLs in _internal root ==="
        Get-ChildItem "_internal/*.dll" | ForEach-Object { $_.Name }
        Write-Host ""
        Write-Host "=== Looking for c10.dll and torch DLLs ==="
        Get-ChildItem -Recurse -Filter "c10*.dll" | ForEach-Object { $_.FullName }
        Get-ChildItem -Recurse -Filter "torch*.dll" | ForEach-Object { $_.FullName }

    - name: Test EXE launches
      working-directory: gui_tool/dist/ShaftSegmentation
      continue-on-error: true
      run: |
        Write-Host "Testing if EXE can start..."
        # Run with console output to capture errors
        $pinfo = New-Object System.Diagnostics.ProcessStartInfo
        $pinfo.FileName = ".\ShaftSegmentation.exe"
        $pinfo.RedirectStandardError = $true
        $pinfo.RedirectStandardOutput = $true
        $pinfo.UseShellExecute = $false
        $p = New-Object System.Diagnostics.Process
        $p.StartInfo = $pinfo
        $p.Start() | Out-Null
        Start-Sleep -Seconds 20
        if ($p.HasExited) {
          Write-Host "Process exited with code: $($p.ExitCode)"
          $stdout = $p.StandardOutput.ReadToEnd()
          $stderr = $p.StandardError.ReadToEnd()
          Write-Host "STDOUT: $stdout"
          Write-Host "STDERR: $stderr"
        } else {
          Write-Host "EXE is running successfully after 20 seconds!"
          $p.Kill()
        }

    - name: Take screenshot of running app
      working-directory: gui_tool/dist/ShaftSegmentation
      continue-on-error: true
      run: |
        pip install pyautogui pillow
        $proc = Start-Process -FilePath ".\ShaftSegmentation.exe" -PassThru
        Start-Sleep -Seconds 10
        python -c "import pyautogui; s=pyautogui.screenshot(); s.save('../../../screenshot.png'); print('Screenshot saved!')"
        if (-not $proc.HasExited) { $proc.Kill() }

    - name: Upload screenshot
      uses: actions/upload-artifact@v4
      with:
        name: app-screenshot
        path: screenshot.png
        if-no-files-found: warn

    - name: Create ZIP archive
      working-directory: gui_tool
      run: |
        Compress-Archive -Path dist/ShaftSegmentation -DestinationPath ../ShaftSegmentation_CPU.zip

    - name: Get version info
      id: version
      run: |
        $date = Get-Date -Format "yyyy.MM.dd"
        $sha = "${{ github.sha }}".Substring(0, 7)
        echo "version=v$date-$sha" >> $env:GITHUB_OUTPUT
        echo "date=$date" >> $env:GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Shaft Segmentation Tool ${{ steps.version.outputs.date }}
        body: |
          ## Shaft Point Cloud Segmentation Tool

          **Model:** Epoch 341 (93.4% accuracy, 84.3% mIoU)

          ### Downloads
          - **ShaftSegmentation_CPU.zip** - Works on any PC (~200MB compressed)

          **Installation:** Extract the ZIP and run `ShaftSegmentation.exe` from the extracted folder.

          ### Features
          - Accepts LAS, E57, PLY, PCD point cloud files
          - Automatic 10m vertical slicing
          - 8-class segmentation: wall, pipe, guard, bunton, wire, column, sheet, column2
          - Outputs combined PLY + per-class family PLYs + visualizations

          ### Usage
          1. Download the appropriate .exe for your system
          2. Double-click to run (no installation needed)
          3. Select your point cloud file and output directory
          4. Click "Start Processing"

          Built from commit: ${{ github.sha }}
        files: |
          ShaftSegmentation_CPU.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Output download links
      run: |
        Write-Host "============================================"
        Write-Host "PUBLIC DOWNLOAD LINK"
        Write-Host "============================================"
        Write-Host ""
        Write-Host "https://github.com/${{ github.repository }}/releases/latest/download/ShaftSegmentation_CPU.zip"
        Write-Host ""
        Write-Host "============================================"
