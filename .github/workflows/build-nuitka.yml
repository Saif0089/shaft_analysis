name: Build Windows Executable (Nuitka)

on:
  push:
    branches: [main, temp_branch]
    paths:
      - 'gui_tool/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nuitka:
    name: Build with Nuitka
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka ordered-set zstandard
        pip install PyQt5>=5.15.0
        pip install numpy>=1.21.0
        pip install laspy>=2.0.0
        pip install plyfile>=0.7.0
        pip install matplotlib>=3.5.0
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install scikit-learn

    - name: Build with Nuitka
      working-directory: gui_tool
      run: |
        python -m nuitka `
          --standalone `
          --onefile `
          --windows-console-mode=disable `
          --output-filename=ShaftSegmentation.exe `
          --include-data-dir=checkpoints=checkpoints `
          --include-data-dir=models=models `
          --enable-plugin=pyqt5 `
          --enable-plugin=numpy `
          --include-package=torch `
          --include-package=torchvision `
          --include-package=sklearn `
          --include-package=laspy `
          --include-package=plyfile `
          --include-package=matplotlib `
          --nofollow-import-to=tkinter `
          --nofollow-import-to=pytest `
          --nofollow-import-to=unittest `
          shaft_segmentation_gui.py

    - name: Find and list output
      working-directory: gui_tool
      run: |
        Write-Host "=== Looking for output files ==="
        Get-ChildItem -Recurse -Filter "*.exe" | ForEach-Object { $_.FullName }
        Get-ChildItem -Recurse -Filter "*.dist" -Directory | ForEach-Object { $_.FullName }

    - name: Test EXE launches
      working-directory: gui_tool
      continue-on-error: true
      run: |
        # Find the exe
        $exe = Get-ChildItem -Recurse -Filter "ShaftSegmentation.exe" | Select-Object -First 1
        if ($exe) {
          Write-Host "Found exe at: $($exe.FullName)"
          Write-Host "Testing if EXE can start..."
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) {
            Write-Host "Process exited with code: $($proc.ExitCode)"
          } else {
            Write-Host "EXE is running successfully after 20 seconds!"
            $proc.Kill()
          }
        } else {
          Write-Host "ERROR: Could not find ShaftSegmentation.exe"
        }

    - name: Take screenshot
      working-directory: gui_tool
      continue-on-error: true
      run: |
        pip install pyautogui pillow
        $exe = Get-ChildItem -Recurse -Filter "ShaftSegmentation.exe" | Select-Object -First 1
        if ($exe) {
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          python -c "import pyautogui; s=pyautogui.screenshot(); s.save('../screenshot_nuitka.png'); print('Screenshot saved!')"
          if (-not $proc.HasExited) { $proc.Kill() }
        }

    - name: Upload screenshot
      uses: actions/upload-artifact@v4
      with:
        name: nuitka-screenshot
        path: screenshot_nuitka.png
        if-no-files-found: warn

    - name: Create ZIP archive
      working-directory: gui_tool
      run: |
        # For --onefile, the exe is in the same directory
        $exe = Get-ChildItem -Recurse -Filter "ShaftSegmentation.exe" | Select-Object -First 1
        if ($exe) {
          # Create a folder with the exe and copy to it
          New-Item -ItemType Directory -Force -Path dist/ShaftSegmentation
          Copy-Item $exe.FullName -Destination dist/ShaftSegmentation/
          Copy-Item -Recurse checkpoints -Destination dist/ShaftSegmentation/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/ShaftSegmentation -DestinationPath ../ShaftSegmentation_Nuitka.zip
        }

    - name: Get version info
      id: version
      run: |
        $date = Get-Date -Format "yyyy.MM.dd"
        $sha = "${{ github.sha }}".Substring(0, 7)
        echo "version=nuitka-v$date-$sha" >> $env:GITHUB_OUTPUT
        echo "date=$date" >> $env:GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Shaft Segmentation (Nuitka) ${{ steps.version.outputs.date }}
        body: |
          ## Shaft Point Cloud Segmentation Tool (Nuitka Build)

          **Model:** Epoch 341 (93.4% accuracy, 84.3% mIoU)

          ### Downloads
          - **ShaftSegmentation_Nuitka.zip** - Built with Nuitka compiler

          **Installation:** Extract the ZIP and run `ShaftSegmentation.exe`

          Built from commit: ${{ github.sha }}
        files: |
          ShaftSegmentation_Nuitka.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
