<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaft Point Cloud Annotator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <h1>Shaft Point Cloud Annotator</h1>
            <div id="slice-info">
                <span id="current-slice">No slice loaded</span>
                <span id="point-count"></span>
            </div>
        </header>

        <!-- Main container -->
        <div id="main-container">
            <!-- Left sidebar - Controls -->
            <aside id="left-sidebar">
                <!-- Slice Selection -->
                <div class="panel">
                    <h3>Slices</h3>
                    <select id="slice-select">
                        <option value="">Select a slice...</option>
                    </select>
                    <button id="load-slice-btn" class="btn primary">Load Slice</button>
                    <button id="copy-slice-btn" class="btn">Copy New Slice</button>
                </div>

                <!-- View Controls -->
                <div class="panel">
                    <h3>View</h3>
                    <div class="control-row">
                        <label>Point Size:</label>
                        <input type="range" id="point-size" min="1" max="10" value="2">
                        <span id="point-size-value">2</span>
                    </div>
                    <div class="control-row">
                        <label>Color Mode:</label>
                        <select id="color-mode">
                            <option value="height">Height</option>
                            <option value="rgb">RGB (if available)</option>
                            <option value="label">Labels</option>
                            <option value="prediction">Predictions</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <button id="reset-camera-btn" class="btn">Reset Camera</button>
                        <button id="top-view-btn" class="btn">Top View</button>
                    </div>
                </div>

                <!-- Annotation Mode -->
                <div class="panel">
                    <h3>Annotation Mode</h3>
                    <div class="mode-buttons">
                        <button id="mode-view" class="btn mode-btn active">View (V)</button>
                        <button id="mode-translate" class="btn mode-btn">Move (T)</button>
                        <button id="mode-rotate" class="btn mode-btn">Rotate (R)</button>
                        <button id="mode-scale" class="btn mode-btn">Scale (S)</button>
                    </div>
                </div>

                <!-- Label Classes -->
                <div class="panel">
                    <h3>Label Classes</h3>
                    <div id="label-list"></div>
                    <div class="add-label-row">
                        <input type="text" id="new-label-name" placeholder="New class name">
                        <input type="color" id="new-label-color" value="#FF0000">
                        <button id="add-label-btn" class="btn">Add</button>
                    </div>
                </div>
            </aside>

            <!-- 3D Viewer -->
            <main id="viewer-container">
                <canvas id="viewer-canvas"></canvas>
                <div id="loading-overlay" class="hidden">
                    <div class="spinner"></div>
                    <span>Loading...</span>
                </div>
            </main>

            <!-- Right sidebar - Box Properties -->
            <aside id="right-sidebar">
                <!-- Box List -->
                <div class="panel">
                    <h3>Bounding Boxes</h3>
                    <div id="box-list"></div>
                    <button id="add-box-btn" class="btn primary">New Box (N)</button>
                </div>

                <!-- Selected Box Properties -->
                <div class="panel" id="box-properties-panel">
                    <h3>Selected Box</h3>
                    <div id="no-selection">No box selected</div>
                    <div id="box-properties" class="hidden">
                        <div class="control-row">
                            <label>Label:</label>
                            <select id="box-label"></select>
                        </div>
                        <div class="control-row">
                            <label>Position:</label>
                            <div class="xyz-inputs">
                                <input type="number" id="box-pos-x" step="0.1">
                                <input type="number" id="box-pos-y" step="0.1">
                                <input type="number" id="box-pos-z" step="0.1">
                            </div>
                        </div>
                        <div class="control-row">
                            <label>Scale:</label>
                            <div class="xyz-inputs">
                                <input type="number" id="box-scale-x" step="0.1" min="0.1">
                                <input type="number" id="box-scale-y" step="0.1" min="0.1">
                                <input type="number" id="box-scale-z" step="0.1" min="0.1">
                            </div>
                        </div>
                        <div class="control-row">
                            <label>Rotation (deg):</label>
                            <div class="xyz-inputs">
                                <input type="number" id="box-rot-x" step="5">
                                <input type="number" id="box-rot-y" step="5">
                                <input type="number" id="box-rot-z" step="5">
                            </div>
                        </div>
                        <button id="delete-box-btn" class="btn danger">Delete Box (Del)</button>
                    </div>
                </div>

                <!-- Actions -->
                <div class="panel">
                    <h3>Actions</h3>
                    <button id="save-annotations-btn" class="btn primary">Save Annotations</button>
                    <button id="generate-gt-btn" class="btn">Generate Ground Truth</button>
                    <hr>
                    <button id="train-btn" class="btn">Train Model</button>
                    <button id="inference-btn" class="btn">Run Inference</button>
                    <hr>
                    <button id="submit-corrections-btn" class="btn primary">Submit Corrections</button>
                </div>

                <!-- Status -->
                <div class="panel">
                    <h3>Status</h3>
                    <div id="status-text">Ready</div>
                    <div id="model-status"></div>
                </div>
            </aside>
        </div>

        <!-- Copy Slice Modal -->
        <div id="copy-slice-modal" class="modal hidden">
            <div class="modal-content">
                <h3>Copy Slice to Working Directory</h3>
                <select id="available-slices-select">
                    <option value="">Loading...</option>
                </select>
                <div class="modal-buttons">
                    <button id="copy-confirm-btn" class="btn primary">Copy</button>
                    <button id="copy-cancel-btn" class="btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js and controls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/TransformControls.js"></script>

    <!-- Application scripts -->
    <script src="/static/js/viewer.js"></script>
    <script src="/static/js/annotator.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
